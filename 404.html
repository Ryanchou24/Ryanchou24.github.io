<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ryan Zhou — Redirecting…</title>
  <script>
    // All routing is hash-based (#/post/...), so any real 404 path
    // just goes home. Old /blog/:id paths map onto the hash router.
    (function () {
      var m = location.pathname.match(/\/(?:blog|post)\/([\w-]+)/);
      location.replace("/" + (m ? "#/post/" + m[1] : ""));
    })();
  </script>
</head>
<body></body>
</html>
